<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" viewBox="0 0 1180 660">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2b3a42"/>
    </marker>
    <style>
      text { font-family: Arial, "PingFang SC", sans-serif; fill: #17242c; }
      .title { font-size: 28px; font-weight: 700; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; }
      .small { font-size: 13px; fill: #42535c; }
      .box { fill: #f8fbfc; stroke: #7c96a3; stroke-width: 2; rx: 8; }
      .core { fill: #eef7ff; stroke: #4b89bd; }
      .ddx { fill: #f2fff4; stroke: #53a05e; }
      .present { fill: #fff6e8; stroke: #c9872b; }
      .fd { fill: #f7f0ff; stroke: #8e69bd; }
      .line { stroke: #2b3a42; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1180" height="660" fill="#ffffff"/>
  <text x="40" y="48" class="title">DRI3 extension overview</text>

  <rect x="40" y="100" width="220" height="130" class="box fd"/>
  <text x="60" y="132" class="box-title">DRI3 client</text>
  <text x="60" y="162" class="body">Owns render buffer</text>
  <text x="60" y="186" class="small">sends fd via X11 request</text>
  <text x="60" y="210" class="small">uses Present for display</text>

  <rect x="330" y="82" width="265" height="165" class="box core"/>
  <text x="352" y="115" class="box-title">dri3_request.c</text>
  <text x="352" y="146" class="body">Protocol validation</text>
  <text x="352" y="171" class="small">PixmapFromBuffer(s)</text>
  <text x="352" y="193" class="small">Buffer(s)FromPixmap</text>
  <text x="352" y="215" class="small">Fence / modifiers</text>

  <rect x="665" y="82" width="235" height="165" class="box core"/>
  <text x="687" y="115" class="box-title">dri3_screen.c</text>
  <text x="687" y="146" class="body">DDX callback bridge</text>
  <text x="687" y="171" class="small">dri3_pixmap_from_fds</text>
  <text x="687" y="193" class="small">dri3_fds_from_pixmap</text>
  <text x="687" y="215" class="small">format/modifier cache</text>

  <rect x="970" y="82" width="170" height="165" class="box ddx"/>
  <text x="992" y="115" class="box-title">DDX backend</text>
  <text x="992" y="146" class="body">Creates Pixmap</text>
  <text x="992" y="171" class="small">imports fd/handle</text>
  <text x="992" y="193" class="small">owns private data</text>
  <text x="992" y="215" class="small">exports if supported</text>

  <rect x="330" y="330" width="265" height="145" class="box present"/>
  <text x="352" y="363" class="box-title">Present extension</text>
  <text x="352" y="394" class="body">Display scheduling</text>
  <text x="352" y="419" class="small">copy fallback</text>
  <text x="352" y="441" class="small">flip / unflip callbacks</text>

  <rect x="665" y="330" width="235" height="145" class="box"/>
  <text x="687" y="363" class="box-title">X resource table</text>
  <text x="687" y="394" class="body">Pixmap resource id</text>
  <text x="687" y="419" class="small">lifetime via DestroyPixmap</text>
  <text x="687" y="441" class="small">drawable visible to clients</text>

  <rect x="970" y="330" width="170" height="145" class="box ddx"/>
  <text x="992" y="363" class="box-title">Screen hooks</text>
  <text x="992" y="394" class="body">CreatePixmap</text>
  <text x="992" y="419" class="small">ModifyPixmapHeader</text>
  <text x="992" y="441" class="small">DestroyPixmap</text>

  <path class="line" d="M260 165 H330"/>
  <text x="274" y="154" class="small">X request + fd</text>
  <path class="line" d="M595 165 H665"/>
  <path class="line" d="M900 165 H970"/>
  <text x="906" y="154" class="small">callback</text>

  <path class="line" d="M1055 247 V330"/>
  <path class="line" d="M970 402 H900"/>
  <path class="line" d="M665 402 H595"/>
  <path class="line dash" d="M462 247 V330"/>
  <text x="474" y="294" class="small">Present uses Pixmap</text>

  <path class="line dash" d="M665 230 C600 285, 670 330, 665 360"/>
  <text x="618" y="300" class="small">resource id</text>

  <text x="40" y="585" class="small">Key point: DRI3 imports/exports buffers; Present decides whether the imported Pixmap is copied or flipped.</text>
</svg>
