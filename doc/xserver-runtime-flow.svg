<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" role="img" aria-labelledby="title desc">
  <title id="title">Xorg server runtime flow</title>
  <desc id="desc">Startup and runtime request/input paths through dix_main, DDX initialization, Dispatch, OS polling, DIX request handlers, and output flushing.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .title { font-size: 26px; font-weight: 700; }
      .section { font-size: 16px; font-weight: 700; }
      .label { font-size: 13px; font-weight: 700; }
      .small { font-size: 12px; fill: #334155; }
      .tiny { font-size: 11px; fill: #475569; }
      .box { stroke: #334155; stroke-width: 1.3; rx: 8; ry: 8; }
      .lane { fill: none; stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 5 5; }
      .arrow { fill: none; stroke: #334155; stroke-width: 1.55; marker-end: url(#arrow); }
      .arrow2 { fill: none; stroke: #64748b; stroke-width: 1.25; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1180" height="900" fill="#f8fafc"/>
  <text x="40" y="48" class="title">Startup, Request Dispatch, and Input Flow</text>

  <rect x="40" y="90" width="1100" height="320" fill="#ffffff" class="box"/>
  <text x="64" y="123" class="section">Startup path</text>

  <rect x="80" y="155" width="175" height="68" fill="#e0f2fe" class="box"/>
  <text x="167" y="183" text-anchor="middle" class="label">dix_main()</text>
  <text x="167" y="204" text-anchor="middle" class="tiny">dix/main.c</text>

  <rect x="305" y="155" width="175" height="68" fill="#dcfce7" class="box"/>
  <text x="392" y="178" text-anchor="middle" class="label">OsInit()</text>
  <text x="392" y="199" text-anchor="middle" class="tiny">sockets, auth, poll</text>

  <rect x="530" y="155" width="175" height="68" fill="#fef3c7" class="box"/>
  <text x="617" y="178" text-anchor="middle" class="label">Core DIX init</text>
  <text x="617" y="199" text-anchor="middle" class="tiny">atoms, resources, fonts</text>

  <rect x="755" y="155" width="175" height="68" fill="#e2e8f0" class="box"/>
  <text x="842" y="178" text-anchor="middle" class="label">InitOutput()</text>
  <text x="842" y="199" text-anchor="middle" class="tiny">DDX AddScreen()</text>

  <rect x="305" y="285" width="175" height="68" fill="#ede9fe" class="box"/>
  <text x="392" y="308" text-anchor="middle" class="label">InitExtensions()</text>
  <text x="392" y="329" text-anchor="middle" class="tiny">AddExtension()</text>

  <rect x="530" y="285" width="175" height="68" fill="#ccfbf1" class="box"/>
  <text x="617" y="308" text-anchor="middle" class="label">InitInput()</text>
  <text x="617" y="329" text-anchor="middle" class="tiny">core + DDX devices</text>

  <rect x="755" y="285" width="175" height="68" fill="#fce7f3" class="box"/>
  <text x="842" y="308" text-anchor="middle" class="label">Dispatch()</text>
  <text x="842" y="329" text-anchor="middle" class="tiny">main server loop</text>

  <path d="M 255 189 L 305 189" class="arrow"/>
  <path d="M 480 189 L 530 189" class="arrow"/>
  <path d="M 705 189 L 755 189" class="arrow"/>
  <path d="M 842 223 C 842 250 392 250 392 285" class="arrow"/>
  <path d="M 480 319 L 530 319" class="arrow"/>
  <path d="M 705 319 L 755 319" class="arrow"/>

  <rect x="40" y="450" width="1100" height="380" fill="#ffffff" class="box"/>
  <text x="64" y="483" class="section">Runtime loop</text>

  <line x1="75" y1="515" x2="1105" y2="515" class="lane"/>
  <text x="80" y="503" class="tiny">OS transport</text>
  <line x1="75" y1="612" x2="1105" y2="612" class="lane"/>
  <text x="80" y="600" class="tiny">DIX dispatch</text>
  <line x1="75" y1="710" x2="1105" y2="710" class="lane"/>
  <text x="80" y="698" class="tiny">Rendering / extensions / input</text>

  <rect x="90" y="535" width="160" height="62" fill="#dcfce7" class="box"/>
  <text x="170" y="559" text-anchor="middle" class="label">ospoll_wait()</text>
  <text x="170" y="579" text-anchor="middle" class="tiny">WaitForSomething()</text>

  <rect x="300" y="535" width="160" height="62" fill="#dcfce7" class="box"/>
  <text x="380" y="559" text-anchor="middle" class="label">ClientReady()</text>
  <text x="380" y="579" text-anchor="middle" class="tiny">mark_client_ready()</text>

  <rect x="510" y="535" width="170" height="62" fill="#dcfce7" class="box"/>
  <text x="595" y="559" text-anchor="middle" class="label">ReadRequest</text>
  <text x="595" y="579" text-anchor="middle" class="tiny">os/io.c</text>

  <rect x="730" y="535" width="170" height="62" fill="#fef3c7" class="box"/>
  <text x="815" y="559" text-anchor="middle" class="label">SmartSchedule</text>
  <text x="815" y="579" text-anchor="middle" class="tiny">choose ready client</text>

  <rect x="90" y="635" width="170" height="62" fill="#fef3c7" class="box"/>
  <text x="175" y="659" text-anchor="middle" class="label">XaceHookDispatch</text>
  <text x="175" y="679" text-anchor="middle" class="tiny">access control</text>

  <rect x="310" y="635" width="170" height="62" fill="#fef3c7" class="box"/>
  <text x="395" y="659" text-anchor="middle" class="label">requestVector</text>
  <text x="395" y="679" text-anchor="middle" class="tiny">ProcVector / swapped</text>

  <rect x="530" y="635" width="170" height="62" fill="#ede9fe" class="box"/>
  <text x="615" y="659" text-anchor="middle" class="label">Request handler</text>
  <text x="615" y="679" text-anchor="middle" class="tiny">DIX or extension proc</text>

  <rect x="750" y="635" width="170" height="62" fill="#fce7f3" class="box"/>
  <text x="835" y="659" text-anchor="middle" class="label">Screen/GC hooks</text>
  <text x="835" y="679" text-anchor="middle" class="tiny">pGC-&gt;ops, pScreen-&gt;*</text>

  <rect x="970" y="635" width="130" height="62" fill="#dcfce7" class="box"/>
  <text x="1035" y="659" text-anchor="middle" class="label">WriteToClient</text>
  <text x="1035" y="679" text-anchor="middle" class="tiny">reply/event/error</text>

  <rect x="90" y="735" width="170" height="62" fill="#ccfbf1" class="box"/>
  <text x="175" y="759" text-anchor="middle" class="label">Input driver fd</text>
  <text x="175" y="779" text-anchor="middle" class="tiny">DDX/platform</text>

  <rect x="310" y="735" width="170" height="62" fill="#ccfbf1" class="box"/>
  <text x="395" y="759" text-anchor="middle" class="label">mieqEnqueue()</text>
  <text x="395" y="779" text-anchor="middle" class="tiny">Queue*Events()</text>

  <rect x="530" y="735" width="170" height="62" fill="#ccfbf1" class="box"/>
  <text x="615" y="759" text-anchor="middle" class="label">InputCheckPending</text>
  <text x="615" y="779" text-anchor="middle" class="tiny">head != tail</text>

  <rect x="750" y="735" width="170" height="62" fill="#ccfbf1" class="box"/>
  <text x="835" y="759" text-anchor="middle" class="label">ProcessInputEvents</text>
  <text x="835" y="779" text-anchor="middle" class="tiny">deliver to devices/clients</text>

  <path d="M 250 566 L 300 566" class="arrow"/>
  <path d="M 460 566 L 510 566" class="arrow"/>
  <path d="M 680 566 L 730 566" class="arrow"/>
  <path d="M 815 597 C 815 615 175 615 175 635" class="arrow"/>
  <path d="M 260 666 L 310 666" class="arrow"/>
  <path d="M 480 666 L 530 666" class="arrow"/>
  <path d="M 700 666 L 750 666" class="arrow"/>
  <path d="M 920 666 L 970 666" class="arrow"/>
  <path d="M 1035 635 C 1035 510 170 510 170 535" class="arrow2"/>

  <path d="M 260 766 L 310 766" class="arrow"/>
  <path d="M 480 766 L 530 766" class="arrow"/>
  <path d="M 700 766 L 750 766" class="arrow"/>
  <path d="M 835 735 C 835 715 395 715 395 697" class="arrow2"/>
</svg>
